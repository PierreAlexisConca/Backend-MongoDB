# =============================================================================
# 02-db-secret.yaml
# Secret tipo Opaque — Credenciales sensibles codificadas en Base64.
#
# IMPORTANTE: Nunca almacenar valores en texto plano aquí.
# Los valores están codificados en Base64 (NO cifrados; Base64 es solo
# encoding). En producción real, usar soluciones como Vault o Sealed Secrets.
#
# Para regenerar los valores:
#   echo -n "mongoadmin"      | base64  → bW9uZ29hZG1pbg==
#   echo -n "mongosecret123"  | base64  → bW9uZ29zZWNyZXQxMjM=
#   echo -n "mongodb://mongoadmin:mongosecret123@mongo-service:27017/db_avsa?authSource=admin" | base64
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: practica-s08
  labels:
    app: avsa-backend
    component: secrets
type: Opaque
data:
  # Usuario de MongoDB — valor original: mongoadmin
  DB_USER: bW9uZ29hZG1pbg==

  # Contraseña de MongoDB — valor original: mongosecret123
  DB_PASS: bW9uZ29zZWNyZXQxMjM=

  # URI completa de conexión para Spring Boot (incluye usuario, contraseña, host y BD)
  # valor original: mongodb://mongoadmin:mongosecret123@mongo-service:27017/db_avsa?authSource=admin
  MONGODB_URI: bW9uZ29kYjovL21vbmdvYWRtaW46bW9uZ29zZWNyZXQxMjNAbW9uZ28tc2VydmljZToyNzAxNy9kYl9hdnNhP2F1dGhTb3VyY2U9YWRtaW4=

  # Base de datos (db_avsa)
  MONGODB_DATABASE: ZGJfYXZzYQ==

  # R2DBC URL (PostgreSQL dummy para evitar crash de Spring Boot)
  # valor original: r2dbc:postgresql://localhost:5432/dummy
  R2DBC_URL: cjJkYmM6cG9zdGdyZXNxbDovL2xvY2FsaG9zdDo1NDMyL2R1bW15

  # R2DBC Username (sa)
  R2DBC_USERNAME: c2E=

  # SERVER_PORT (8081)
  SERVER_PORT: ODA4MQ==
